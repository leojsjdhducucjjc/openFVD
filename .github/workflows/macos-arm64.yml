name: macOS Apple Silicon

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: macos-15
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: brew install qt@5 glm

      - name: Build and package arm64 app
        run: ./scripts/build-macos-arm64.sh

      - name: Upload Apple Silicon app
        uses: actions/upload-artifact@v4
        with:
          name: FVD-Apple-Silicon
          path: dist/FVD-Apple-Silicon.zip
          if-no-files-found: error
