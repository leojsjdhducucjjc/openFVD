name: Build Downloads

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: brew install qt@5 glm

      - name: Build and run regression tests
        run: |
          test_build="$RUNNER_TEMP/openfvd-regression-tests"
          mkdir -p "$test_build"
          cd "$test_build"
          "$(brew --prefix qt@5)/bin/qmake" "$GITHUB_WORKSPACE/tests/tests.pro" CONFIG+=release CONFIG+=sdk_no_version_check
          make -j"$(sysctl -n hw.logicalcpu)"
          ./fvd_regression_tests

      - name: Build and package arm64 app
        run: ./scripts/build-macos-arm64.sh

      - name: Upload Apple Silicon app
        uses: actions/upload-artifact@v4
        with:
          name: FVD-Apple-Silicon
          path: dist/FVD-Apple-Silicon.zip
          if-no-files-found: error
          retention-days: 30

  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          cache: true

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install glm:x64-windows glew:x64-windows
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg failed with exit code $LASTEXITCODE."
          }
          "OPENFVD_DEPS_ROOT=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and package Windows app
        shell: pwsh
        run: ./scripts/build-windows-x64.ps1

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: FVD-Windows-x64
          path: dist/FVD-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Apple Silicon app
        uses: actions/download-artifact@v4
        with:
          name: FVD-Apple-Silicon
          path: release

      - name: Download Windows app
        uses: actions/download-artifact@v4
        with:
          name: FVD-Windows-x64
          path: release

      - name: Generate checksums
        run: |
          cd release
          sha256sum FVD-Apple-Silicon.zip FVD-Windows-x64.zip > SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "FVD++ $GITHUB_REF_NAME" \
              --generate-notes
          fi
